name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release version consistency
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          $frontend = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoLine = Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"$' | Select-Object -First 1
          $cargo = $cargoLine.Matches[0].Groups[1].Value
          if ($tagVersion -ne $frontend -or $frontend -ne $tauri -or $frontend -ne $cargo) {
            throw "Release versions differ: tag=$tagVersion frontend=$frontend tauri=$tauri cargo=$cargo"
          }
          Write-Host "Release version is consistent: $tagVersion"

      - name: Build complete Windows installer
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          New-Item -ItemType Directory -Force runtime/backend-dist | Out-Null
          python -m PyInstaller --noconfirm --clean --onefile --name vuln-sentinel-backend --distpath runtime/backend-dist --workpath build/pyinstaller --specpath build --collect-submodules app --hidden-import=main main.py
          npm ci --prefix frontend
          npm run build --prefix frontend
          Push-Location src-tauri
          npm --prefix ../frontend exec -- tauri build
          Pop-Location

      - name: Prepare installer asset
        id: prep
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          if ($installer.Length -lt 1MB) { throw "Installer is unexpectedly small: $($installer.Length) bytes" }
          Copy-Item $installer.FullName "release-assets/Vuln-Sentinel-$version-win64-setup.exe"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sign Windows installer when certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Host 'Windows signing certificate is not configured; keeping unsigned artifact.'
            exit 0
          }
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*setup.exe' | Select-Object -First 1
          $pfx = Join-Path $env:RUNNER_TEMP 'vuln-sentinel-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = (Get-ChildItem '${env:ProgramFiles(x86)}\Windows Kits\10\bin\**\signtool.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw 'signtool.exe was not found on the Windows runner' }
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
          & $signtool verify /pa $installer.FullName
          Remove-Item -Force $pfx

      - name: Test Windows install lifecycle
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer missing before lifecycle test' }
          ./scripts/verify_windows_installer.ps1 -InstallerPath $installer.FullName

      # A force-updated tag can leave GitHub's existing release metadata pointing
      # at the old tag object. Remove that stale release so the asset is created
      # against the commit that was actually built.
      - name: Remove stale release for force-updated tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --yes 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host 'No existing release to remove.' }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: release-assets/Vuln-Sentinel-${{ steps.prep.outputs.version }}-win64-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-release-asset:
    name: Verify Published Windows Release Asset
    needs: release
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Download published installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          New-Item -ItemType Directory -Force downloaded-release | Out-Null
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern "Vuln-Sentinel-$version-win64-setup.exe" --dir downloaded-release --clobber

      - name: Validate published installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem downloaded-release -Filter '*setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Published Windows installer asset is missing' }
          if ($installer.Length -lt 1MB) { throw "Published installer is unexpectedly small: $($installer.Length) bytes" }
          $signature = (Get-Content $installer.FullName -AsByteStream -TotalCount 2 | ForEach-Object {[char]$_}) -join ''
          if ($signature -ne 'MZ') { throw 'Published asset is not a Windows PE installer' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          Write-Host "Published installer: $($installer.Name)"
          Write-Host "Bytes: $($installer.Length)"
          Write-Host "SHA256: $hash"
          @("file=$($installer.Name)", "bytes=$($installer.Length)", "sha256=$hash") | Set-Content downloaded-release\verification.txt

      - name: Upload release verification report
        uses: actions/upload-artifact@v5
        with:
          name: vuln-sentinel-release-asset-verification-${{ github.ref_name }}
          path: downloaded-release/verification.txt
          if-no-files-found: error
          retention-days: 14
