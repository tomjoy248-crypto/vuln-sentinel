name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  python-quality:
    name: Python Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # mypy 为可选检查工具，单独安装
          pip install mypy

      - name: Run ruff lint
        run: ruff check app/ --select E9,F --output-format=concise

      - name: Run mypy type checking
        run: python -m mypy app/ --ignore-missing-imports || true

      - name: Run bandit security scan
        run: bandit -r app/ -c pyproject.toml || true

      - name: Run tests
        run: pytest -q

      - name: Security baseline check
        run: python scripts/security_baseline_check.py

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          python scripts/dependency_security_scan.py

  frontend-build:
    name: Frontend Build & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  windows-desktop-smoke:
    name: Windows Desktop Smoke
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bundled backend runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          New-Item -ItemType Directory -Force runtime/backend-dist | Out-Null
          python -m PyInstaller --noconfirm --clean --onefile --name vuln-sentinel-backend --distpath runtime/backend-dist --workpath build/pyinstaller --specpath build --collect-submodules app --hidden-import=main main.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run src/templates.test.js

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

      - name: Build desktop backend
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Build desktop installer
        working-directory: src-tauri
        run: npm --prefix ../frontend exec -- tauri build

      - name: Verify desktop bundle inputs
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw
          if ($config -notmatch 'Vuln Sentinel') { throw 'Missing product name in Tauri config' }
          if (-not (Test-Path frontend/dist/index.html)) { throw 'frontend/dist/index.html missing after build' }
          if (-not (Test-Path runtime/backend-dist/vuln-sentinel-backend.exe)) { throw 'backend executable missing' }
          if (-not (Test-Path src-tauri/target/release/vuln-sentinel-desktop.exe)) { throw 'desktop exe missing after build' }
          if (-not (Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*setup.exe' -ErrorAction SilentlyContinue)) { throw 'installer missing after tauri build' }
          Write-Host 'Windows desktop smoke checks passed.'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: vuln-sentinel-windows-installer
          path: src-tauri/target/release/bundle/nsis/*setup.exe
          if-no-files-found: error
          retention-days: 14

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [python-quality, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: vuln-sentinel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
