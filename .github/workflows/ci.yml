name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  python-quality:
    name: Python Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # mypy 为可选检查工具，单独安装
          pip install mypy

      - name: Run ruff lint
        run: ruff check .

      - name: Run mypy type checking
        run: python -m mypy app/ --ignore-missing-imports || true

      - name: Run bandit security scan
        run: bandit -r app/ -c pyproject.toml || true

      - name: Run tests
        run: pytest -q

      - name: Security baseline check
        run: python scripts/security_baseline_check.py

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          python scripts/dependency_security_scan.py

  frontend-build:
    name: Frontend Build & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [python-quality, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: vuln-sentinel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
