# Alembic 数据库迁移配置
#
# 首次使用前请安装依赖：pip install alembic sqlalchemy
#
# sqlalchemy.url 此处留空（占位），实际值由 alembic/env.py 按以下优先级
# 动态注入，兼容 SQLite 与 PostgreSQL：
#   1. 环境变量 DATABASE_URL（最高优先级，推荐用于容器化 / CI 部署）
#      示例：postgresql://user:pass@localhost:5432/vuln_sentinel
#   2. app.core.config.settings.database_url（来自 .env / pydantic 配置）
#   3. SQLite 默认路径：{db_dir}/{db_name}（兜底，便于本地开发）
#
# 也可在执行命令时通过 -x 临时覆盖，例如：
#   alembic -x dburl=sqlite:///./tmp.db upgrade head
#
# 首次接入已有数据库时，请执行 `alembic stamp head` 将当前库标记为最新版本，
# 之后再通过 `alembic revision -m "描述"` 新增迁移脚本并 `alembic upgrade head` 应用。

[alembic]
# 迁移脚本目录
script_location = alembic

# 迁移脚本文件命名模板：日期_序号_描述
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 版本路径分隔符
version_path_separator = os

# sqlalchemy.url 占位符，实际值由 env.py 从环境变量 DATABASE_URL / settings 注入。
# 此处必须留空，避免硬编码连接串泄露凭证。
sqlalchemy.url =

# 输出编码
output_encoding = utf-8

# SQLAlchemy 日志 SQL 输出（调试时可改为 INFO）
# sqlalchemy.echo = false


[post_write_hooks]
# 可在此配置 ruff / black 等格式化钩子，对新生成的迁移脚本自动格式化


# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
