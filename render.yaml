# Render deployment blueprint
# Use as a starting point for production. Fill in environment variables in the dashboard.

services:
  - type: web
    name: vuln-sentinel
    runtime: docker
    plan: starter
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: PRODUCTION
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_SECONDS
        value: "86400"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DB_DIR
        value: "/data"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: PUBLIC_DEMO_ENABLED
        value: "1"
      - key: FREE_TRIAL_ENABLED
        value: "1"
      - key: ENABLE_METRICS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
