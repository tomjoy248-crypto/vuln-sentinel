<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Vuln Sentinel - 安全修复闭环平台：扫描发现风险、生成修复配置、复测验证、导出报告">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="./icon-192x192.png">
  <title>Vuln Sentinel</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: linear-gradient(180deg, #0f172a 0%, #111827 100%); color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
    #boot-screen { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    #boot-screen .panel { width: min(560px, calc(100vw - 48px)); padding: 28px 30px; border-radius: 16px; background: rgba(15, 23, 42, 0.78); border: 1px solid rgba(148, 163, 184, 0.18); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.38); }
    #boot-screen .title { font-size: 22px; font-weight: 700; margin: 0 0 10px; }
    #boot-screen .desc { margin: 0; font-size: 14px; line-height: 1.8; color: #cbd5e1; }
    #boot-screen .bar { margin-top: 18px; height: 10px; border-radius: 999px; overflow: hidden; background: rgba(148, 163, 184, 0.14); }
    #boot-screen .bar > span { display: block; width: 40%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #38bdf8, #22c55e); animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="boot-screen" aria-live="polite">
    <div class="panel">
      <div class="title">Vuln Sentinel 正在启动</div>
      <p class="desc">正在检查本地服务并加载主界面，请稍候。</p>
      <div class="bar"><span></span></div>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
