<style>  body { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; }

<script>
  document.querySelectorAll('.scan-depth-opt').forEach(function(el) {
    el.addEventListener('click', function() {
      console.log('scan-depth-opt clicked');
    });
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      var chat = document.querySelector('ai-chat');
      if (chat) return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key === "/") {
      console.log('Ctrl/Cmd + / shortcut');

  });
